<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ strategy_name }} — Trades</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 20px 60px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #ffffff;
      color: #212121;
      max-width: 1400px;
      margin-left: auto;
      margin-right: auto;
    }
    a.back {
      display: inline-block;
      margin-bottom: 16px;
      font-size: 15px;
      color: #4caf50;
      text-decoration: none;
      font-weight: 600;
    }
    a.back:hover { text-decoration: underline; }
    h1 { font-size: 1.35rem; font-weight: 600; margin: 8px 0 16px; }
    .meta { font-size: 13px; color: #555; margin-bottom: 20px; line-height: 1.8; }
    .meta span { display: inline-block; margin-right: 20px; }

    /* Summary cards */
    .summary {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }
    .summary-card {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 14px 18px;
      min-width: 140px;
    }
    .summary-card .label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 4px;
    }
    .summary-card .value {
      font-size: 20px;
      font-weight: 700;
      color: #212121;
    }
    .summary-card .value.green { color: #4caf50; }
    .summary-card .value.red   { color: #ef5350; }
    .summary-card .value.amber { color: #f59e0b; }

    /* Legend */
    .legend {
      display: flex;
      gap: 16px;
      margin-bottom: 16px;
      font-size: 12px;
      color: #555;
      flex-wrap: wrap;
    }
    .legend-item { display: flex; align-items: center; gap: 6px; }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 2px; flex-shrink: 0;
    }
    .legend-dot.agree-win  { background: rgba(76,175,80,0.15); }
    .legend-dot.agree-loss { background: rgba(239,83,80,0.12); }
    .legend-dot.flipped    { background: rgba(245,158,11,0.18); }

    /* Table */
    .table-wrap {
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid #e0e0e0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      min-width: 900px;
    }
    thead tr {
      background: #f5f5f5;
      border-bottom: 2px solid #e0e0e0;
    }
    th {
      padding: 10px 12px;
      text-align: left;
      font-weight: 600;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #555;
      white-space: nowrap;
    }
    td {
      padding: 9px 12px;
      border-bottom: 1px solid #f0f0f0;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: none; }

    /* Row tints */
    tr.agree-win  td { background: rgba(76,175,80,0.06); }
    tr.agree-loss td { background: rgba(239,83,80,0.05); }
    tr.flipped    td { background: rgba(245,158,11,0.10); }

    /* Result badges */
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge.tp { background: rgba(76,175,80,0.15); color: #2e7d32; }
    .badge.sl { background: rgba(239,83,80,0.12); color: #c62828; }
    .badge.to { background: rgba(0,0,0,0.07);     color: #555;    }

    .dir-buy  { color: #4caf50; font-weight: 600; }
    .dir-sell { color: #ef5350; font-weight: 600; }
    .clean-yes { color: #4caf50; }
    .clean-no  { color: #ef5350; }

    .pnl-pos { color: #4caf50; font-weight: 600; }
    .pnl-neg { color: #ef5350; font-weight: 600; }

    .flip-note {
      font-size: 11px;
      color: #f59e0b;
      font-weight: 600;
    }
  </style>
</head>
<body>

<a class="back" href="/chart/{{ strategy_id }}">← Chart</a>

<h1>{{ strategy_name }}</h1>
<div class="meta">
  <span>{{ instrument }}</span>
  <span>Anchor: {{ anchor }}</span>
  <span>Complement: {{ complement }}</span>
  <span>Live since: {{ go_live_at }}</span>
</div>

<!-- Temporary diagnostic (Prompt 1); Prompt 2 replaces with real table + stats -->
<pre style="margin:0; padding:16px; background:#f8f8f8; border:1px solid #e0e0e0; border-radius:8px; font-size:12px; line-height:1.45; overflow:auto; max-height:80vh;">{{ trades | tojson(indent=2) }}</pre>

</body>
</html>
